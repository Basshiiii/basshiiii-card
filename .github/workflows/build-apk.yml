name: Build Android APK

on:
  push:
    branches: [main, android-app]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Put the card into the app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk basshiiii-card.apk

      - uses: actions/upload-artifact@v4
        with:
          name: basshiiii-card-apk
          path: basshiiii-card.apk

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ばっしーの名刺 APK(最新)
          body: スマホでこのページを開いて basshiiii-card.apk をダウンロード → インストール。
          files: basshiiii-card.apk
          make_latest: true
