<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111"><title></title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none} html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#111;color:#f5f2ec}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:0;background:#111}
.wrap{width:100%;height:100dvh;display:flex;align-items:center;justify-content:center;padding:0;gap:0}
.kicker,.hint,.controls,.foot{display:none!important}
.card-scene{width:min(100vw, 928px);perspective:1400px;cursor:pointer;touch-action:manipulation;outline:none}
.card{position:relative;width:100%;aspect-ratio:928 / 444;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.75,.25,1);border-radius:16px}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;overflow:hidden;box-shadow:0 18px 48px rgba(0,0,0,.48),0 0 0 1px rgba(255,190,68,.14)}
.face img{display:block;width:100%;height:100%;object-fit:cover}
.back{transform:rotateY(180deg)}
.hint{display:flex;align-items:center;gap:9px;color:#bdb8ae;font-size:13px;letter-spacing:.04em}
.tapicon{width:24px;height:24px;border:1px solid #b8872e;border-radius:50%;display:grid;place-items:center;color:#f3b747;font-size:12px}
.controls{display:flex;gap:10px;width:100%;justify-content:center}
button{font:inherit;border:1px solid rgba(255,184,65,.45);background:rgba(255,184,65,.08);color:#f4c36b;padding:11px 20px;border-radius:999px;font-size:13px;letter-spacing:.06em;cursor:pointer}
button.active{background:#f0b23d;color:#17130c;border-color:#f0b23d}
.foot{font-size:10px;color:#77736c;letter-spacing:.08em;text-align:center;line-height:1.7}
@media (orientation:landscape) and (max-height:600px){body,.wrap{width:100vw;height:100dvh;min-height:100dvh;padding:0}.card-scene{width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center}.card{width:100vw;height:auto;max-height:100dvh;aspect-ratio:928 / 444;border-radius:0}.face{border-radius:0}.face img{object-fit:contain;background:#111}}
@media(min-width:600px){.card{aspect-ratio:928 / 444}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style></head>
